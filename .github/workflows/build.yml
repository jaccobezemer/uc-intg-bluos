name: Build and Release

on:
  push:
    tags:
      - 'v*' # Start de workflow bij het pushen van een tag, bv. v0.2.1
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      PYTHON_VER: 3.11.13-0.4.0 #3.11.6-0.2.0
    permissions:
      contents: write # Nodig om een release te kunnen aanmaken en assets te uploaden

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install jq

    - name: Get version
      id: get_version
      run: |
        version=$(jq -r .version driver.json)
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build executable in Docker
      run: |
        echo "Starting PyInstaller build inside aarch64 container..."
        docker run --rm --name builder \
          --platform=linux/aarch64 \
          --user=$(id -u):$(id -g) \
          -v ${GITHUB_WORKSPACE}:/workspace \
          docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
          bash -c \
          "cd /workspace && \
            python -m pip install -r requirements.txt && \
            pyinstaller --clean --onedir --name intg-bluos --paths intg-bluos --collect-all zeroconf --collect-all ucapi --collect-all ucapi_framework intg-bluos/driver.py"

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts/bin
        mv dist/intg-bluos/* artifacts/bin/
        mv artifacts/bin/intg-bluos artifacts/bin/driver
        cp driver.json artifacts/
        cp bluos.png artifacts/

    - name: Create package
      run: |
        tar -czvf bluos-v${{ steps.get_version.outputs.version }}.tar.gz -C artifacts .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        files: ./bluos-v${{ steps.get_version.outputs.version }}.tar.gz